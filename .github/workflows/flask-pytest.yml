name: MyTemplate Quality CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, security, backend, and UI checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies and Chromium
        run: make browser-install-ci

      - name: Run quality pipeline
        run: make ci

      - name: Upload QA reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 14
